<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Prototaip] Semak Kelayakan - Sistem eROY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <div id="header"></div>
  <ol class="breadcrumb"><li>Panduan</li><li class="active">Semak Kelayakan</li></ol>
  <div class="row"><div class="col-md-8 col-md-offset-2">
    <div class="panel panel-default">
      <div class="panel-heading">Semak Kelayakan</div>
      <div class="panel-body">
        <p>Jawab 5 soalan ringkas untuk mengetahui sama ada anda boleh mengemukakan permohonan pendaftaran pertubuhan belia.</p>
        <form id="ef" class="form-horizontal" data-live="1">
          <div class="form-group"><label class="col-sm-5 control-label" for="role">Jawatan anda dalam pertubuhan</label>
            <div class="col-sm-7"><select id="role" name="role" class="form-control" required>
              <option value="">Sila pilih</option><option>Setiausaha</option><option>Pengerusi</option><option>Bendahari</option><option>AJK lain</option></select></div></div>
          <div class="form-group"><label class="col-sm-5 control-label" for="age">Umur anda</label>
            <div class="col-sm-3"><input id="age" name="age" type="number" min="10" max="99" class="form-control" required></div></div>
          <div class="form-group"><label class="col-sm-5 control-label" for="members">Bilangan ahli jawatankuasa penaja</label>
            <div class="col-sm-3"><input id="members" name="members" type="number" min="0" max="999" class="form-control" required></div></div>
          <div class="form-group"><span class="col-sm-5 control-label"><b>Jawatan anda didaftarkan dalam AJK Penaja?</b></span>
            <div class="col-sm-7">
              <label class="radio-inline"><input type="radio" name="inAjk" value="yes" required> Ya</label>
              <label class="radio-inline"><input type="radio" name="inAjk" value="no"> Tidak</label></div></div>
          <div class="form-group"><label class="col-sm-5 control-label" for="level">Peringkat pertubuhan</label>
            <div class="col-sm-7"><select id="level" name="level" class="form-control" required>
              <option value="">Sila pilih</option><option>Kebangsaan</option><option>Negeri</option><option>Daerah</option><option>Bahagian</option><option>Kawasan</option><option>Lokaliti</option></select></div></div>
          <div class="form-group" id="branches-row" hidden><label class="col-sm-5 control-label" for="branches">Bilangan cawangan / badan gabungan</label>
            <div class="col-sm-3"><input id="branches" name="branches" type="number" min="0" max="999" class="form-control"></div></div>
          <div class="text-center"><button class="btn btn-primary"><span class="glyphicon glyphicon-check"></span> Semak kelayakan</button></div>
        </form>
        <div id="result" aria-live="polite"></div>
      </div>
    </div>
  </div></div>
  <footer id="footer"></footer>
</div>
<script src="assets/rules.js"></script>
<script>
const ef = document.getElementById('ef'), result = document.getElementById('result');
ef.level.onchange = () => { document.getElementById('branches-row').hidden = !['Kebangsaan', 'Negeri'].includes(ef.level.value); };
let last = null;
function render() {
  if (!last) return;
  const en = document.documentElement.lang === 'en';
  const icon = { true: '✓', false: '✗', warn: '!' };
  result.innerHTML = `<div class="alert ${last.eligible ? 'alert-success' : 'alert-danger'} elig-verdict"></div><ul class="elig-list"></ul>
    <p class="elig-actions"></p>`;
  result.querySelector('.elig-verdict').textContent = last.eligible
    ? (en ? 'You meet the basic requirements to apply.' : 'Anda memenuhi syarat asas untuk memohon.')
    : (en ? 'Not yet eligible — see the items marked ✗ below.' : 'Belum layak — lihat perkara bertanda ✗ di bawah.');
  const ul = result.querySelector('.elig-list');
  for (const r of last.results) {
    const li = document.createElement('li');
    li.className = 'elig-' + (r.ok === 'warn' ? 'warn' : r.ok ? 'ok' : 'fail');
    const a = Object.assign(document.createElement('a'), { href: r.src, textContent: en ? 'source' : 'sumber' });
    if (r.src.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
    li.append(Object.assign(document.createElement('span'), { className: 'elig-icon', textContent: icon[r.ok] }), (en ? r.en : r.ms) + ' ', a);
    ul.append(li);
  }
  result.querySelector('.elig-actions').innerHTML = last.eligible
    ? `<a class="btn btn-success" href="daftar.html">${en ? 'Start registering' : 'Mula mendaftar'}</a> <a class="btn btn-default" href="dokumen.html">${en ? 'Check your documents' : 'Semak dokumen anda'}</a>`
    : `<button type="button" class="btn btn-warning" id="ask-ai">${en ? 'Ask AI what to do' : 'Tanya AI apa perlu dibuat'}</button>`;
  const ask = document.getElementById('ask-ai');
  if (ask) ask.onclick = () => window.eroyAsk((en ? 'I am not yet eligible to register a youth organisation because: ' : 'Saya belum layak mendaftar pertubuhan belia kerana: ')
    + last.results.filter(r => r.ok === false).map(r => en ? r.en : r.ms).join(' ') + (en ? ' What can I do?' : ' Apa yang boleh saya lakukan?'));
}
ef.onsubmit = e => { e.preventDefault(); last = checkEligibility(Object.fromEntries(new FormData(ef))); render(); };
document.addEventListener('langchange', render);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/config.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/i18n.js"></script>
</body>
</html>
