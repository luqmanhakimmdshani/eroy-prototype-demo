<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Prototaip] Lupa Katalaluan - Sistem eROY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/style.css?v=20261125150139">
</head>
<body>
<div class="shell">
  <div id="header"></div>
  <div class="row"><div class="col-md-6 col-md-offset-3">
    <div class="panel panel-default">
      <div class="panel-heading">Lupa Katalaluan</div>
      <div class="panel-body">
        <p>Masukkan No. Kad Pengenalan yang didaftarkan. Pautan untuk menetapkan semula katalaluan akan dihantar ke alamat emel anda.</p>
        <form class="form-horizontal">
          <div class="form-group"><label class="col-sm-4 control-label" for="ic">No Kad Pengenalan :</label>
            <div class="col-sm-8"><input id="ic" class="form-control" inputmode="numeric" pattern="\d{12}" maxlength="12" required></div></div>
          <div class="form-group"><div class="col-sm-8 col-sm-offset-4">
            <button class="btn btn-primary">Hantar</button> <a href="index.html" class="btn btn-default">Kembali</a>
            <div class="form-msg" style="margin-top:10px"></div></div></div>
        </form>
      </div>
    </div>
  </div></div>
  <footer id="footer"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
