<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Prototaip] Carian Pertubuhan - Sistem eROY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <div id="header"></div>
  <ol class="breadcrumb"><li>Senarai</li><li class="active">Carian Pertubuhan</li></ol>
  <div class="panel panel-default">
    <div class="panel-heading">Senarai Carian Pertubuhan</div>
    <div class="panel-body">
      <!-- One search box: number, name or a plain description -->
      <form id="qs" class="one-search" data-live="1" role="search">
        <label class="sr-only" for="q">Cari pertubuhan</label>
        <div class="input-group">
          <input id="q" class="form-control input-lg" maxlength="300" autocomplete="off"
                 placeholder="Cth: majlis belia bukan lulus · Johor atau Kedah · masih dalam proses lebih 2 minggu">
          <span class="input-group-btn"><button class="btn btn-primary btn-lg"><span class="glyphicon glyphicon-search"></span> Cari</button></span>
        </div>
      </form>
      <div class="filter-chips" id="chips" aria-live="polite"></div>
      <p class="search-note" id="search-note" aria-live="polite"></p>
      <p class="search-note" id="fuzzy-note" aria-live="polite"></p>

      <details class="adv-filters" id="adv">
        <summary>Tapis lanjut</summary>
        <form id="f" class="form-horizontal" data-live="1">
          <div class="form-group">
            <label class="col-sm-2 control-label" for="f-no">No. Pendaftaran Pertubuhan :</label><div class="col-sm-4"><input id="f-no" name="no" class="form-control"></div>
            <label class="col-sm-2 control-label" for="f-nama">Nama Pertubuhan :</label><div class="col-sm-4"><input id="f-nama" name="nama" class="form-control"></div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label" for="f-jenis">Jenis Pertubuhan :</label>
            <div class="col-sm-4"><select id="f-jenis" name="jenis" class="form-control"><option value="">Sila pilih</option><option>Tunggal</option></select></div>
            <label class="col-sm-2 control-label" for="f-status">Status Pendaftaran :</label>
            <div class="col-sm-4"><select id="f-status" name="status" class="form-control"><option value="">Sila pilih</option>
              <option>Dalam Proses Semakan</option><option>Kuiri Pendaftaran</option><option>Menunggu Pembayaran</option><option>Tolak</option>
              <option>Lulus</option><option>Kelulusan Bersyarat</option><option>Dibenarkan Menubuhkan Cawangan</option></select></div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label" for="f-peringkat">Peringkat Pertubuhan :</label>
            <div class="col-sm-4"><select id="f-peringkat" name="peringkat" class="form-control"><option value="">Sila pilih</option>
              <option>Kebangsaan</option><option>Negeri</option><option>Daerah</option><option>Bahagian</option><option>Kawasan</option><option>Lokaliti</option></select></div>
          </div>
          <div class="text-center"><button class="btn btn-primary"><span class="glyphicon glyphicon-search"></span> Cari</button> <button type="reset" class="btn btn-default">Set Semula</button></div>
        </form>
      </details>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-condensed">
          <thead><tr><th>#</th><th>No. Pendaftaran Pertubuhan</th><th>Nama Pertubuhan</th><th>Jenis Pertubuhan</th><th>Peringkat Pertubuhan</th><th>Status Pendaftaran</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty-help" aria-live="polite"></div>
    </div>
  </div>
  <footer id="footer"></footer>
</div>
<script src="assets/data.js"></script>
<script src="assets/search.js"></script>
<script>
// ponytail: client-side filter over mock data; swap for a real API call when there's a backend.
const en = () => document.documentElement.lang === 'en';
const t = (ms, e) => (en() ? e : ms);
const el = (tag, props) => Object.assign(document.createElement(tag), props);
const SIMPLE = ['no', 'nama', 'jenis', 'status', 'peringkat'];  // the fields the advanced form can hold
const f = document.getElementById('f'), note = document.getElementById('search-note');
let state = emptyFilters();  // the one source of truth; the advanced form mirrors its simple fields
const syncForm = () => SIMPLE.forEach(k => { f.elements[k].value = state[k] || ''; });
const setState = v => { state = { ...emptyFilters(), ...v }; syncForm(); render(); };
const clearKey = k => { state = cleared(state, k); syncForm(); render(); };
const sameList = (a, b) => a.length === b.length && a.every(x => b.includes(x));

// Tag text for each kind of filter. Status names sit in their own <span> so the BM/EN switch can translate them.
function tagParts(k, v) {
  const spans = list => list.flatMap((x, i) => [i ? ', ' : '', el('span', { textContent: x })]);
  switch (k) {
    case 'no': return ['No.: ', v];
    case 'nama': return [t('Nama: ', 'Name: '), v];
    case 'namaAny': return [t('Nama: ', 'Name: '), v.join(t(' atau ', ' or '))];
    case 'jenis': return [t('Jenis: ', 'Type: '), el('span', { textContent: v })];
    case 'status': return ['Status: ', el('span', { textContent: v })];
    case 'statusIn': return ['Status: ', state.statusInLabel ? t(...state.statusInLabel) : spans(v)].flat();
    case 'statusNot': return [t('Bukan: ', 'Not: '), sameList(v, PENDING) ? t('masih dalam proses', 'still in progress')
                                                     : sameList(v, DECIDED) ? t('sudah ada keputusan', 'decided') : spans(v)].flat();
    case 'peringkat': return [t('Peringkat: ', 'Level: '), el('span', { textContent: v })];
    case 'minDays': return [t(`Lebih ${v} hari di peringkat semasa`, `More than ${v} days at the current stage`)];
  }
}
const KEYS = ['no', 'nama', 'namaAny', 'jenis', 'status', 'statusIn', 'statusNot', 'peringkat', 'minDays'];

function chip(k) {
  const b = el('button', { type: 'button', className: 'filter-chip' });
  b.append(...tagParts(k, state[k]), el('span', { className: 'chip-x', textContent: ' ✕', ariaHidden: 'true' }));
  b.setAttribute('aria-label', t('Buang tapisan: ', 'Remove filter: ') + b.textContent.replace(' ✕', ''));
  b.onclick = () => clearKey(k);
  return b;
}

function render() {
  const hits = applyFilters(PERTUBUHAN, state), active = KEYS.filter(k => isActive(state, k));

  // What the search is using, as removable tags.
  const chips = document.getElementById('chips');
  chips.replaceChildren(...active.map(chip));
  if (active.length > 1) {
    const all = el('button', { type: 'button', className: 'btn btn-link btn-xs', textContent: t('Kosongkan semua', 'Clear all') });
    all.onclick = () => { document.getElementById('q').value = ''; note.textContent = ''; setState({}); };
    chips.append(all);
  }
  if (active.length) chips.prepend(el('span', { className: 'chips-count', textContent: t(`${hits.length} hasil · `, `${hits.length} result${hits.length === 1 ? '' : 's'} · `) }));

  // Say when a near spelling found the names.
  const fuzzyNote = document.getElementById('fuzzy-note');
  fuzzyNote.textContent = (state.nama || state.namaAny.length) && applyFilters(PERTUBUHAN, state, { fuzzy: false }).length < hits.length
    ? t('Termasuk nama dengan ejaan hampir sama.', 'Includes names with a similar spelling.') : '';

  rows.innerHTML = hits.map((p, i) => {
    const days = PENDING.includes(p.status) ? ` <small class="text-muted">· ${daysAtStage(p)} ${t('hari', 'days')}</small>` : '';
    return `<tr><td>${i + 1}.</td><td><a href="semak.html?no=${p.no}" title="Semak status">${p.no}</a></td><td>${p.nama}</td><td>${p.jenis}</td><td>${p.peringkat}</td>` +
      `<td><button type="button" class="btn-link status-ai" data-status="${p.status}" title="Terangkan dengan AI">${p.status} <span class="glyphicon glyphicon-question-sign"></span></button>${days}</td></tr>`;
  }).join('');

  // No results: say which filter to drop, and how many results that would give.
  const help = document.getElementById('empty-help');
  help.replaceChildren();
  if (!hits.length) {
    const box = el('div', { className: 'empty-help' });
    box.append(el('b', { textContent: t('Tiada pertubuhan sepadan dengan semua tapisan.', 'No organisation matches all the filters.') }));
    const rel = relaxations(PERTUBUHAN, state);
    if (rel.length) {
      box.append(el('span', { textContent: t(' Cuba:', ' Try:') }));
      rel.forEach(r => {
        const b = el('button', { type: 'button', className: 'btn btn-default btn-sm' });
        b.append(t('tanpa "', 'without "'), ...tagParts(r.drop, state[r.drop]), `"` + t(` (${r.count} hasil)`, ` (${r.count} result${r.count === 1 ? '' : 's'})`));
        b.onclick = () => clearKey(r.drop);
        box.append(' ', b);
      });
    }
    help.append(box);
  }
}

// One box: understand locally first; only unclear words go to the AI.
document.getElementById('qs').onsubmit = async e => {
  e.preventDefault();
  const text = document.getElementById('q').value.trim(), btn = e.target.querySelector('button');
  note.textContent = '';
  if (!text) return setState({});
  const parsed = parseQuery(text, PERTUBUHAN);
  if (!parsed.needsAI) return setState(parsed.filters);
  btn.disabled = true;
  note.textContent = t('Memahami carian anda dengan AI…', 'Understanding your search with AI…');
  try {
    const r = await fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: text }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    // Keep what we understood locally (groups, exclusions, time) and add what the AI read.
    setState({ ...parsed.filters, ...Object.fromEntries(['no', 'nama', 'status', 'peringkat'].filter(k => j[k]).map(k => [k, j[k]])) });
    // The tags show exactly what was applied; the model's own summary can claim filters it didn't set.
    note.textContent = t('✓ Difahami dengan bantuan AI — semak tapisan di atas.', '✓ Understood with AI — check the filters above.');
  } catch {
    // AI unavailable: keep what we understood and search the remaining words as a name.
    setState({ ...parsed.filters, nama: parsed.leftover.toUpperCase() });
    note.textContent = t('AI tidak tersedia — carian menggunakan kata kunci sahaja.', 'AI unavailable — searched by keywords only.');
  }
  btn.disabled = false;
};

// Status explainer: clicking a status asks the assistant what it means and what to do next.
rows.onclick = e => {
  const b = e.target.closest('.status-ai');
  if (b) window.eroyAsk(en()
    ? `What does the status "${b.dataset.status}" mean and what should the applicant do next?`
    : `Apakah maksud status "${b.dataset.status}" dan apa yang perlu dilakukan oleh pemohon seterusnya?`);
};
f.onsubmit = e => { e.preventDefault(); state = { ...state, ...Object.fromEntries(new FormData(f)) }; render(); };
f.onreset = () => setTimeout(() => setState({}));
render();
document.addEventListener('langchange', render);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/config.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/i18n.js"></script>
</body>
</html>
